<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>KidzHouse Operação</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Poppins:wght@400;600;800&display=swap">
<style>
  :root{--bg:#f8eed7;--surface:#fffaf0;--ink:#141210;--ink-3:#8a7f70;--line:#e6d9bd;--orange:#f76806;--crit:#d7263d;color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Poppins","Segoe UI",system-ui,sans-serif;padding:24px}
  .card{background:var(--surface);border:2px solid var(--ink);border-radius:12px;box-shadow:0 3px 0 var(--ink);padding:28px;width:min(420px,100%);position:relative;margin-top:18px}
  .card::before{content:"";position:absolute;left:-2px;top:-16px;width:40%;height:18px;background:var(--orange);border:2px solid var(--ink);border-bottom:0;border-radius:8px 8px 0 0}
  img{width:160px;display:block;margin:0 auto 14px}
  h1{font-family:"Lilita One","Arial Black",Impact,sans-serif;font-weight:400;text-transform:uppercase;color:var(--orange);font-size:26px;margin:0 0 4px;text-align:center}
  p{margin:0 0 16px;text-align:center;font-size:13px;color:var(--ink-3)}
  label{display:block;font-size:12px;font-weight:600;margin-bottom:6px}
  input{width:100%;font:inherit;padding:10px 12px;border:2px solid var(--ink);border-radius:8px;background:#fff;color:var(--ink)}
  button{margin-top:12px;width:100%;font:inherit;font-weight:800;padding:10px;border:2px solid var(--ink);border-radius:999px;background:var(--orange);color:#fff6ea;cursor:pointer;box-shadow:0 2px 0 var(--ink)}
  button:disabled{opacity:.6;cursor:wait}
  .err{color:var(--crit);font-size:12px;margin-top:10px;min-height:16px;text-align:center}
  .rem{display:flex;gap:8px;align-items:center;font-size:12px;margin-top:10px}
  .rem input{width:16px;height:16px;accent-color:var(--orange)}
  footer{font-size:11px;color:var(--ink-3);text-align:center;margin-top:16px}
</style>
</head>

<script>
(function(){
  const payload = document.getElementById('payload').textContent.trim();
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const bytes = b64(payload);
  const salt = bytes.slice(0,16), iv = bytes.slice(16,32), mac = bytes.slice(32,64), ct = bytes.slice(64);
  const enc = new TextEncoder();
  const err = document.getElementById('err'), btn = document.getElementById('btn'), pw = document.getElementById('pw');
  if(!(window.crypto && crypto.subtle)){ err.textContent = 'Este navegador bloqueou a criptografia nesta origem. Abra a página pelo endereço https do site.'; btn.disabled = true; return; }
  async function derive(password){
    const base = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveBits']);
    const bits = new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2', salt, iterations:200000, hash:'SHA-256'}, base, 512));
    const aes = await crypto.subtle.importKey('raw', bits.slice(0,32), {name:'AES-CBC'}, false, ['decrypt']);
    const hm = await crypto.subtle.importKey('raw', bits.slice(32,64), {name:'HMAC', hash:'SHA-256'}, false, ['verify']);
    return {aes, hm};
  }
  async function open(password){
    const k = await derive(password);
    const data = new Uint8Array(iv.length + ct.length); data.set(iv); data.set(ct, iv.length);
    const ok = await crypto.subtle.verify('HMAC', k.hm, mac, data);
    if(!ok) throw new Error('bad');
    const plain = await crypto.subtle.decrypt({name:'AES-CBC', iv}, k.aes, ct);
    const html = new TextDecoder().decode(plain);
    document.open(); document.write(html); document.close();
  }
  async function tryOpen(password, remember){
    btn.disabled = true; err.textContent = '';
    try { await open(password); try{ if(remember) localStorage.setItem('kh-key', password); }catch(e){} }
    catch(e){ err.textContent = 'Senha incorreta.'; btn.disabled = false; pw.focus(); pw.select(); try{ localStorage.removeItem('kh-key'); }catch(x){} }
  }
  document.getElementById('f').addEventListener('submit', e => { e.preventDefault(); tryOpen(pw.value, document.getElementById('rem').checked); });
  try { const saved = localStorage.getItem('kh-key'); if(saved){ pw.value = saved; tryOpen(saved, true); } } catch(e){}
})();
</script>
